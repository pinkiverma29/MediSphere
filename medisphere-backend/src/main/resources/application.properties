# ==========================================
# MediSphere Application
# ==========================================

spring.application.name=medisphere-backend

# ==========================================
# Server Configuration
# ==========================================

server.port=${PORT:8080}

# ==========================================
# PostgreSQL Database
# (Uses env vars when deployed; falls back to local defaults for your laptop)
# ==========================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medisphere}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:MediSphere@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Configuration
# ==========================================

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_SECRET_KEY_FOR_MEDISPHERE}
app.jwt.expiration=86400000

# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.com.medisphere=INFO